name: Collect Bangalore Commute Data

on:
  workflow_dispatch:
    inputs:
      time_slot:
        description: "Select commute collection slot"
        required: true
        type: choice
        options:
          - morning_peak
          - baseline
          - evening_peak

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Set time slot
        id: slot
        shell: bash
        run: |
          echo "slot=${{ inputs.time_slot }}" >> "$GITHUB_OUTPUT"

      - name: Collect commute data
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python python/collect_commute_data.py "${{ steps.slot.outputs.slot }}"

      - name: Commit collected data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/bangalore_commute_raw.csv

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: collect ${{ steps.slot.outputs.slot }} commute observations"
            git push
          fi